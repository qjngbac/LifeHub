name: 功能建议
description: 建议一个适合本地优先 Android 应用的功能或改进
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望如何操作和展示？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式
      description: 现在如何解决，主要不便是什么？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议适用于 Android，并尽量保持核心功能离线可用。
          required: true

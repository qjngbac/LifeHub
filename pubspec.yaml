name: lifehub
description: Personal Life OS - 统一的学习、工作、生活、户外管理平台
publish_to: 'none'
version: 1.9.7+14

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^12.1.3

  # Database & Persistence
  drift: ^2.34.3
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: 10.3.10
  shared_preferences: ^2.5.5
  workmanager: ^0.9.0+3

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.6.0
  collection: ^1.19.1
  json_annotation: ^4.12.0
  http: ^1.5.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  geolocator: 13.0.4
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  json_serializable: ^6.14.1

dependency_overrides:
  # The published package assumes AGP 9 built-in Kotlin is enabled. LifeHub
  # keeps it disabled for Flutter plugin compatibility, so use the vendored
  # fixed copy to keep a fresh checkout reproducible.
  workmanager_android:
    path: third_party/workmanager_android

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/content/first_aid/
    - assets/content/entertainment/
    - assets/content/consumer_guide/
    - assets/content/drug_info/
